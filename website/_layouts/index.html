{{#extends "base"}}
{{#block "main"}}
<section id="hero" class="hero-section">
  <div class="container hero-container text-center">
    <div class="pill-badge">
      <span class="pill-tag">NEW</span>
      <span class="pill-text">v0.0.4 Unified Release · TMUX IDE · MCP Agent · Worktrees</span>
    </div>
    <h1 class="hero-title">{{headline}}</h1>
    <p class="hero-lead">{{lead}}</p>
    <div class="hero-cta-group">
      <a class="btn btn-primary btn-lg" href="#quickstart">Quick Start</a>
      <a class="btn btn-secondary btn-lg" href="https://github.com/sebastienrousseau/{{name}}" target="_blank" rel="noopener">Star on GitHub</a>
    </div>

    <!-- Authentic 4-Pane TMUX IDE Terminal Grid -->
    <figure class="terminal-preview-card" aria-label="4-Pane TMUX IDE Grid Preview">
      <figcaption class="terminal-header">
        <div class="window-dots">
          <span class="dot dot-red" aria-hidden="true"></span>
          <span class="dot dot-yellow" aria-hidden="true"></span>
          <span class="dot dot-green" aria-hidden="true"></span>
        </div>
        <div class="terminal-tab-bar font-mono">
          <span class="tmux-win-badge">[pythondev]</span>
          <span class="tab-item active-tab">0:ide* (4 panes)</span>
          <span class="tab-item">1:bash</span>
          <span class="tab-item">2:mcp</span>
        </div>
        <div class="terminal-actions">
          <span class="badge-status font-mono">● Python 3.12+ · uv · ruff (Prefix + i)</span>
        </div>
      </figcaption>

      <div class="tmux-grid">
        <!-- Pane 1: Project Explorer (Left 20%) -->
        <div class="tmux-pane pane-explorer font-mono">
          <div class="pane-header">
            <span class="pane-title">1: Explorer</span>
            <span class="pane-badge">/work</span>
          </div>
          <div class="pane-content explorer-content">
<div class="tree-node dir">▼ src/</div>
<div class="tree-node dir">  ▼ agent/</div>
<div class="tree-node file active">    ▶ pipeline.py</div>
<div class="tree-node file">      models.py</div>
<div class="tree-node dir">▼ tests/</div>
<div class="tree-node file">  test_pipeline.py</div>
<div class="tree-node file">pyproject.toml</div>
          </div>
        </div>

        <!-- Center Column: Pane 2 (Editor Top) + Pane 3 (Terminal Bottom) -->
        <div class="tmux-center-col">
          <!-- Pane 2: Editor (Neovim LSP) -->
          <div class="tmux-pane pane-editor font-mono">
            <div class="pane-header">
              <span class="pane-title">2: Neovim (LSP)</span>
              <span class="pane-file">src/agent/pipeline.py</span>
            </div>
            <div class="pane-content editor-content" tabindex="0" role="region" aria-label="Neovim Code Editor">
              <pre class="editor-code font-mono"><code><span class="code-comment"># src/agent/pipeline.py · Python 3.12+ Async Pipeline</span>
<span class="code-kw">from</span> typing <span class="code-kw">import</span> <span class="code-type">AsyncIterator</span>
<span class="code-kw">from</span> dataclasses <span class="code-kw">import</span> dataclass

<span class="code-fn">@dataclass</span>(frozen=<span class="code-kw">True</span>, slots=<span class="code-kw">True</span>)
<span class="code-kw">class</span> <span class="code-type">StreamResult</span>:
    payload: <span class="code-type">bytes</span>
    latency_ms: <span class="code-type">float</span>

<span class="code-kw">async def</span> <span class="code-fn">transform</span>(stream: <span class="code-type">AsyncIterator</span>[<span class="code-type">str</span>]) -&gt; <span class="code-type">list</span>[<span class="code-type">StreamResult</span>]:
    <span class="code-kw">return</span> [<span class="code-type">StreamResult</span>(s.<span class="code-fn">encode</span>(), <span class="code-num">0.12</span>) <span class="code-kw">async for</span> s <span class="code-kw">in</span> stream]</code></pre>
            </div>
          </div>

          <!-- Pane 3: Integrated Shell / Test Runner -->
          <div class="tmux-pane pane-terminal font-mono">
            <div class="pane-header">
              <span class="pane-title">3: Shell / Tests</span>
              <span class="pane-badge">idle</span>
            </div>
            <div class="pane-content terminal-content font-mono" tabindex="0" role="region" aria-label="Integrated Terminal">
<div class="cli-line"><span class="mcp-tl-ps">$ </span>uv run mypy --strict src/ &amp;&amp; uv run pytest -v</div>
<div class="cli-out">Success: no issues found in 18 source files</div>
<div class="cli-out cli-ok">48 passed in 0.14s (100% statement coverage)</div>
            </div>
          </div>
        </div>

        <!-- Pane 4: AI Agent / MCP Server (Right 24%) -->
        <div class="tmux-pane pane-ai font-mono">
          <div class="pane-header">
            <span class="pane-title">4: Claude Code</span>
            <span class="pane-badge ai-badge">MCP Agent</span>
          </div>
          <div class="pane-content ai-content font-mono" tabindex="0" role="region" aria-label="AI Agent Panel">
<div class="ai-prompt"><span class="ai-sym">&gt;</span> Claude Code (MCP)</div>
<div class="ai-tool">⏺ Tool: ruff.format("src/")</div>
<div class="ai-res">✓ 18 files left unchanged (clean format)</div>
<div class="ai-tool">⏺ Tool: pyright.diagnostics()</div>
<div class="ai-res">✓ 0 type errors · strict mode verified</div>
          </div>
        </div>
      </div>

      <!-- TMUX Status Bar -->
      <div class="tmux-status-bar font-mono">
        <span class="status-left">[pythondev:ide*] 0:nvim* 1:pytest 2:claude "pythondev-ide" 23:55</span>
        <span class="status-center">muxtree: main (clean) · mcp: stdio (JSON-RPC)</span>
        <span class="status-right">23:55 29-Aug-26</span>
      </div>
    </figure>
  </div>
</section>

<!-- Content sections rendered from Markdown -->
<div class="content-sections">
  {{!content}}
</div>

{{/block}}
